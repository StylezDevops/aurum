<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <style>
    text { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #e0e0e0; }
    .title { font-size: 14px; font-weight: bold; }
    .sub { font-size: 12px; fill: #a0a0c0; }
    .label { font-size: 11px; fill: #505070; }
    line { stroke: #4a4a6a; stroke-width: 1.5; }
    polygon { fill: #4a4a6a; }
  </style>

  <rect x="0" y="0" width="600" height="280" fill="#0f0f1a" rx="12"/>

  <!-- Class A -->
  <rect x="20" y="20" width="168" height="88" rx="7" fill="#0f2520" stroke="#207060" stroke-width="1.5"/>
  <text class="title" x="104" y="46" text-anchor="middle">Class A</text>
  <text class="sub" x="104" y="65" text-anchor="middle">low risk</text>
  <text class="sub" x="104" y="82" text-anchor="middle">reversible</text>
  <text class="sub" x="104" y="99" text-anchor="middle">auto-approve + log</text>

  <!-- Class B -->
  <rect x="216" y="20" width="168" height="88" rx="7" fill="#201a08" stroke="#806020" stroke-width="1.5"/>
  <text class="title" x="300" y="46" text-anchor="middle">Class B</text>
  <text class="sub" x="300" y="65" text-anchor="middle">medium risk</text>
  <text class="sub" x="300" y="82" text-anchor="middle"> </text>
  <text class="sub" x="300" y="99" text-anchor="middle">batched review</text>

  <!-- Class C -->
  <rect x="412" y="20" width="168" height="88" rx="7" fill="#200808" stroke="#803030" stroke-width="1.5"/>
  <text class="title" x="496" y="46" text-anchor="middle">Class C</text>
  <text class="sub" x="496" y="65" text-anchor="middle">high risk</text>
  <text class="sub" x="496" y="82" text-anchor="middle">irreversible</text>
  <text class="sub" x="496" y="99" text-anchor="middle">individual review</text>

  <!-- Arrow down -->
  <line x1="300" y1="108" x2="300" y2="138"/>
  <polygon points="293,134 300,148 307,134"/>

  <!-- Absence box -->
  <rect x="20" y="148" width="560" height="72" rx="7" fill="#180a0a" stroke="#602020" stroke-width="1.5"/>
  <text class="title" x="300" y="174" text-anchor="middle">If the owner is absent</text>
  <text class="sub" x="300" y="194" text-anchor="middle">B and C expire closed · capability growth pauses</text>
  <text class="sub" x="300" y="210" text-anchor="middle">only trusted reversible operations continue</text>

  <text class="label" x="300" y="268" text-anchor="middle">fig 3 — absence shrinks the agent, never grows it</text>
</svg>
